
trigger:
- main

pool:
  vmImage: ubuntu-latest
stages:
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@1
      displayName: 'Installing Terra'
      inputs:
        terraformVersion: $(version)

    - task: TerraformTask@5
      displayName: 'Initializing Terra'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backend-key)
    - task: TerraformTask@5
      displayName : 'Planning Terraform'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'terra-con'

- stage: Apply
  dependsOn : Plan
  jobs:
  - job: Apply
    steps:
    - task: TerraformInstaller@1
      displayName: 'Installing Terraform'
      inputs:
        terraformVersion: $(version)
    - task: TerraformTask@5
      displayName: 'Initializing Terra'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backend-key)
    - task: TerraformTask@5
      displayName: "Applying changes"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'terra-con'