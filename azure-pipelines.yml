trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.10.5'

    - task: AzureCLI@2
      displayName: 'Set ARM env vars'
      inputs:
        azureSubscription: 'terra-con'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
          echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
          echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
          echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"
    - task: TerraformTask@5
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backend-key)
        backendAzureRmUseEntraIdForAuthentication: true

    - task: TerraformTask@5
      displayName: 'Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'terra-con'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan

- stage: Apply
  dependsOn: Plan
  jobs:
  - job: Apply
    steps:
    - download: current
      artifact: tfplan

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.10.5'

    - task: TerraformTask@5
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backend-key)
        backendAzureRmUseEntraIdForAuthentication: true

    - task: TerraformTask@5
      displayName: 'Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'terra-con'
        commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'