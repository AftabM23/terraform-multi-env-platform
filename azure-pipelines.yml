
trigger:
- main

pool:
  vmImage: ubuntu-latest
stages:
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(version)

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backedn-key)
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'terra-con'

- stage: Apply
  dependsOn : Plan
  jobs:
  - job: InstallTerra
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(version)

  - job: TerraformApply
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'terra-con'