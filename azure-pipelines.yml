# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'


- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'Azure subscription 1(b14398ec-6e89-44a6-ad7c-d7dfcf9ffac5)'
    backendAzureRmResourceGroupName: 'rg-linux-practice'
    backendAzureRmStorageAccountName: 'abstorage23'
    backendAzureRmContainerName: 'tf-state-container01'
    backendAzureRmKey: $(backedn-key)