# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Plan
  jobs :
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(version)


    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backend-key)
        backendAzureRmUseEnvironmentVariablesForAuthentication: true 

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'fmt'
        environmentServiceNameAzureRM: 'terra-con'
        useEnvironmentVariablesForAuthentication: true

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        environmentServiceNameAzureRM: 'terra-con'
        useEnvironmentVariablesForAuthentication: true

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'terra-con'
        useEnvironmentVariablesForAuthentication: true

- stage: Apply
  dependsOn : Plan
  jobs :
  - job: TerraformApply
    steps: 
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(version)


    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'terra-con'
        backendAzureRmResourceGroupName: 'rg-linux-practice'
        backendAzureRmStorageAccountName: 'abstorage23'
        backendAzureRmContainerName: 'tf-state-container01'
        backendAzureRmKey: $(backend-key)
        backendAzureRmUseEnvironmentVariablesForAuthentication: true 

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'terra-con'
        useEnvironmentVariablesForAuthentication: true